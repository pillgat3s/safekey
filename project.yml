name: SafeKey
options:
  bundleIdPrefix: com.andri
  deploymentTarget:
    macOS: "26.0"
    # iOS 26 for the same reason the Mac app targets macOS 26: the app is built
    # in that release's design language — the floating bottom search bar and
    # toolbar spacers among them — and back-porting it would mean two layouts.
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: YES
targets:
  # One audited core, compiled for both platforms. It imports no AppKit and no
  # UIKit, so the security-critical code is the same source on Mac and iPhone
  # rather than a port that can drift out of sync.
  SafeKeyCore:
    type: framework
    platform: [macOS, iOS]
    sources:
      - Sources/SafeKeyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andri.safekey.core

  SafeKey:
    type: application
    platform: macOS
    sources:
      - Sources/SafeKey
      - Sources/SafeKeyShared
    dependencies:
      - target: SafeKeyCore_macOS
        embed: true
      # LAAuthenticationView — renders the Touch ID prompt inside the app's own
      # window instead of as a floating system panel.
      - sdk: LocalAuthenticationEmbeddedUI.framework
    settings:
      base:
        # ".mac" because plain com.andri.safekey is already registered to
        # someone else and cannot be claimed. The vault lives at a path derived
        # from the app *name*, and the Keychain service is a fixed string, so
        # neither moves when this changes.
        PRODUCT_BUNDLE_IDENTIFIER: com.andri.safekey.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_ENTITLEMENTS: Sources/SafeKey/SafeKey.entitlements
        # A stable signing identity: ad-hoc signatures change on every rebuild,
        # so Keychain ACLs stop matching and stored Touch ID keys break.
        # Automatic rather than manual because an iCloud entitlement needs a
        # provisioning profile that grants the container, and only automatic
        # signing will fetch one. The certificate is the same either way, so the
        # signing identity — and therefore the Keychain ACLs — do not change.
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: RR9A8973M8
    info:
      path: Sources/SafeKey/Info.plist
      properties:
        CFBundleDisplayName: SafeKey
        CFBundleName: SafeKey
        LSApplicationCategoryType: public.app-category.utilities
        NSFaceIDUsageDescription: "SafeKey uses Touch ID to unlock your vault."
        NSSupportsSuddenTermination: false
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: ""

  SafeKeyiOS:
    type: application
    platform: iOS
    sources:
      - Sources/SafeKeyiOS
      - Sources/SafeKeyShared
    dependencies:
      - target: SafeKeyCore_iOS
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andri.safekey.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Real development signing, not ad-hoc. An unsigned bundle carries no
        # application-identifier, and without it every Keychain call returns
        # errSecMissingEntitlement — no Face ID, no attempt counter, no visible
        # error. Ad-hoc ("Sign to Run Locally") fixes that but leaves Xcode
        # with no team, so it cannot register capabilities against the App ID,
        # which is what an iCloud container needs.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: RR9A8973M8
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGNING_REQUIRED: "YES"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_ENTITLEMENTS: Sources/SafeKeyiOS/SafeKeyiOS.entitlements
    info:
      path: Sources/SafeKeyiOS/Info.plist
      properties:
        CFBundleDisplayName: SafeKey
        UILaunchScreen: {}
        NSFaceIDUsageDescription: "SafeKey uses Face ID to unlock your vault."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  SafeKeyCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/SafeKeyCoreTests
      - Tests/Support
    dependencies:
      - target: SafeKeyCore_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andri.safekey.coretests

  SafeKeyCoreiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/SafeKeyCoreTests
      - Tests/Support
    dependencies:
      - target: SafeKeyCore_iOS
      # Hosted in the app so the tests inherit its Keychain entitlement. A
      # standalone iOS test bundle has no application-identifier, so every
      # Keychain call in it fails with errSecMissingEntitlement.
      - target: SafeKeyiOS
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andri.safekey.coretests.ios
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "YES"
        CODE_SIGNING_ALLOWED: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SafeKeyiOS.app/SafeKeyiOS"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # The sync coordinator and the session are shared by both apps and belong to
  # neither, so they are compiled into this bundle directly. Testing them
  # through an app target would mean launching one; they are plain @MainActor
  # classes and need no UI.
  SafeKeySharedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/SafeKeySharedTests
      - Tests/Support
      - Sources/SafeKeyShared/SyncCoordinator.swift
      - Sources/SafeKeyShared/VaultSession.swift
    dependencies:
      - target: SafeKeyCore_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andri.safekey.sharedtests

  SafeKeyiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/SafeKeyiOSUITests
    dependencies:
      - target: SafeKeyiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andri.safekey.uitests.ios
        TEST_TARGET_NAME: SafeKeyiOS
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "YES"
        CODE_SIGNING_ALLOWED: "YES"

  SafeKeyUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/SafeKeyUITests
    dependencies:
      - target: SafeKey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andri.safekey.uitests
        TEST_TARGET_NAME: SafeKey

schemes:
  SafeKey:
    build:
      targets:
        SafeKey: all
        SafeKeyCore_macOS: all
        SafeKeyCoreTests: [test]
        SafeKeySharedTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SafeKeyCoreTests
        - SafeKeySharedTests

  SafeKeyiOS:
    build:
      targets:
        SafeKeyiOS: all
        SafeKeyCore_iOS: all
        SafeKeyCoreiOSTests: [test]
        SafeKeyiOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SafeKeyCoreiOSTests
        - SafeKeyiOSUITests
